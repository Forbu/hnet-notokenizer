[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hnet-notokenizer"
version = "0.1.0"
description = "Byte-level Hierarchical Network (H-Net) with Dynamic Chunking (No Tokenizer)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "datasets>=2.18.0",
    "tqdm>=4.66.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
h100 = [
    "mamba-ssm>=2.2.2",
    "causal-conv1d>=1.4.0",
    "wandb>=0.16.0",
]

[tool.setuptools.packages.find]
include = ["hnet*"]
